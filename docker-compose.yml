services:
  starmap-room-display:
    build:
      context: .
      dockerfile: Dockerfile
    image: starmap-display:latest
    container_name: starmap-display
    restart: unless-stopped
    ports:
      # 绑定本机回环地址，避免暴露至外部网络
      - "127.0.0.1:8765:8765"
      # 若使用 AirGradient ONE 8PSL 本地 MQTT 推送模式（source.protocol=mqtt, mqtt_mode=listen），
      # 取消下一行注释向局域网开放 1883 只读监听（仅接收 airgradient/readings/<id>，从不发布控制帧）
      # - "1883:1883"
    volumes:
      # 持久化挂载宿主机 var 目录（保存已绑定的 config.json 与 SQLite 运行库）
      - ./var:/app/var
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - CTDS_LISTEN_HOST=0.0.0.0
      - CTDS_IN_CONTAINER=1
