services:
  starmap-room-display:
    build:
      context: .
      dockerfile: Dockerfile
    image: starmap-display:latest
    container_name: starmap-display
    restart: unless-stopped
    ports:
      # 绑定本机回环地址，避免暴露至外部网络
      - "127.0.0.1:8765:8765"
    volumes:
      # 持久化挂载宿主机 var 目录（保存已绑定的 config.json 与 SQLite 运行库）
      - ./var:/app/var
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - CTDS_LISTEN_HOST=0.0.0.0
      - CTDS_IN_CONTAINER=1
