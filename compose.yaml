name: ctd-space

services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docker}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    image: ctd-collector:latest
    build:
      context: .
      dockerfile: collector/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docker}
      EIGHT_EMAIL: ${EIGHT_EMAIL:-}
      EIGHT_PASSWORD: ${EIGHT_PASSWORD:-}
      AIRGRADIENT_HOST: ${AIRGRADIENT_HOST:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ctd-web:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docker}
      NEXT_PUBLIC_ROOM_NAME: ${ROOM_NAME:-睡眠房}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
