<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-scale="projection">
<head>
  <meta charset="utf-8">
  <title>房间空气质量大屏</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <svg id="sky" aria-hidden="true" focusable="false"></svg>

  <main class="cockpit-shell" aria-label="空间环境">
    <section class="cockpit-panel">
      <header class="cockpit-header">
        <div class="title-block">
          <h1 id="room-name">睡眠房</h1>
        </div>

        <div class="header-controls">
          <span class="clock-pill" title="当前时间">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
            <span id="clock" class="astra-clock">--:--</span>
          </span>
          <button type="button" id="theme-toggle" class="theme-switch" aria-label="切换黑夜与白昼模式">
            <span class="theme-opt" data-mode="dark" title="黑夜模式（默认）">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </span>
            <span class="theme-opt" data-mode="light" title="白昼模式">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            </span>
          </button>
        </div>
      </header>

      <div class="trail-bar" aria-label="采样时序轨">
        <span id="trail-start" class="trail-time">--:--</span>
        <div id="update-trail" class="trail-svg-wrap"></div>
        <span id="trail-end" class="trail-time trail-time-now">--:--</span>
      </div>

      <!-- 模块一：室内环境（空间空气与温湿） -->
      <section class="env-module env-indoor" id="indoor-section" aria-label="室内环境">
        <div class="module-head">
          <div class="module-head-left">
            <span class="module-head-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg>
            </span>
            <h2 class="module-title" id="indoor-label">室内环境</h2>
            <span class="module-dot" aria-hidden="true">·</span>
            <span class="module-sub">空间空气与温湿</span>
          </div>
          <div class="module-head-right">
            <span id="state-badge" class="astra-badge" title="室内环境数据状态"></span>
          </div>
        </div>
        <div class="vit-primary" id="metrics-grid"></div>
        <div class="vit-secondary" id="secondary-grid"></div>
      </section>

      <!-- 模块二：床微环境（睡眠体征与温控） -->
      <section class="env-module env-bed" id="pod-section" aria-label="床微环境">
        <div class="module-head" id="pod-card">
          <div class="module-head-left">
            <span class="module-head-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>
            </span>
            <h2 class="module-title" id="pod-label">床微环境</h2>
            <span class="module-dot" aria-hidden="true">·</span>
            <span class="module-sub">睡眠体征与温控</span>
          </div>
          <div class="module-head-right">
            <span class="pod-state-pill" id="pod-status">待接入</span>
          </div>
        </div>
        <div class="vit-pod" id="pod-metrics-grid"></div>
      </section>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
