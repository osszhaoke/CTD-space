<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>展示字段配置 — CTDS C01</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="theme-dark admin-body">
  <header class="app-header">
    <div class="header-left">
      <h1>展示字段配置</h1>
      <span class="badge">本机管理</span>
    </div>
    <div class="header-right">
      <a href="/" class="btn-admin">← 返回大屏</a>
    </div>
  </header>

  <div id="notice" class="banner hidden"></div>

  <main class="admin-main">
    <p class="admin-intro">
      勾选需要在大屏展示的指标，可调整顺序与中文名称。
      <strong>Pod 5 敏感人体指标不开放配置；设备网络地址/凭据不可在此访问。</strong>
    </p>

    <form id="fields-form">
      <table class="fields-table">
        <thead>
          <tr>
            <th>启用</th>
            <th>顺序</th>
            <th>中文名称</th>
            <th>指标 ID</th>
            <th>单位</th>
            <th>可用性</th>
          </tr>
        </thead>
        <tbody id="fields-tbody">
          <!-- rows rendered by admin.js -->
        </tbody>
      </table>

      <div class="form-actions">
        <button type="submit" class="btn-primary" id="btn-save">保存配置</button>
        <button type="button" class="btn-secondary" id="btn-reset">重新载入</button>
        <span id="save-status" class="save-status"></span>
      </div>
    </form>
  </main>

  <script src="/static/admin.js"></script>
</body>
</html>
